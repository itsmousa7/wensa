  <style>
    *,

    body {
      background: linear-gradient(180deg, #ffffff 0%, #f2fbfc 100%);
      color: #102b30;

      text-align: center;

    .logo {
      width: min(150px, 38vw);
      height: auto;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #d6eef1;
      border-top-color: #2f9bab;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #status {
      font-size: 0.95rem;
      color: #5c7a80;
    }

    .subtitle {
      font-size: 1rem;
      color: #5c7a80;
      max-width: 300px;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      width: 100%;
      max-width: 280px;
    }

    .actions.hidden {
      display: none;
    }

    .store-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1.25rem;
      border-radius: 14px;
      text-decoration: none;
      background: #102b30;
      color: #ffffff;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 6px 18px rgba(16, 43, 48, 0.15);
    }

    .store-btn:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .store-btn:active {
      transform: translateY(0);
    }

    .store-btn.google {
      background: #ffffff;
      color: #102b30;
      border: 1.5px solid #dcebed;
      box-shadow: 0 6px 18px rgba(16, 43, 48, 0.06);
    }

    .store-btn svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .store-btn .label {
      text-align: start;
      line-height: 1.15;
    }

    .store-btn .label .small {
      display: block;
      font-size: 0.68rem;
      opacity: 0.8;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    .store-btn .label .big {

    footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.78rem;
      color: #9bb3b7;

  <script src="/assets/inapp-redirect.js"></script>
  <script>
    (function () {
      // No browserTarget: hand off straight to the store URL for this device
      // so the browser opens the store and immediately defers to the native
      // App Store / Play Store app. Routing via our own page instead would
      // add a visible browser stop before the store.
      var env = WensaInAppRedirect.init({
        wholePage: true,
        autoAttempt: true
      });
      var iosUrl = document.getElementById('iosBtn').href;
      var androidUrl = document.getElementById('androidBtn').href;

      function revealActions(message) {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').textContent = message;
        document.getElementById('actions').classList.remove('hidden');
      }

      // Only auto-navigate to a store when this is confirmed to be a real
      // browser. Redirecting an in-app webview to the App Store renders a
      // blank page, so anything we can't confirm must fall through to the
      // buttons instead - a visible page is always better than a white one.
      if (env.isRealBrowser && env.isIOS) {
        location.replace(iosUrl);
        return;
      }
      if (env.isRealBrowser && env.isAndroid) {
        location.replace(androidUrl);
        return;
      }

      if (env.isInApp) {
        // canEscape (Instagram/Facebook): autoAttempt already fired the
        // handoff and the buttons are the fallback. Otherwise (TikTok,
        // Snapchat, ...) there's no working scheme, so a tap does a plain
        // navigation to the store.
        revealActions(env.canEscape ? 'دنوديك للمتجر…' : 'نزّل ونسة من المتجر');
        return;
      }

      // Desktop, or a device we can't confidently classify: show both.
      revealActions('اختار المتجر حتى تنزّل ونسة');
    })();
  </script>
